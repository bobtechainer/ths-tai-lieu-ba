<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ hệ thống Trường học số</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     Màu chỉ dùng để mã hoá LOẠI LIÊN KẾT — không trang trí, và
     không dùng để phân biệt chặng. Một ký hiệu một nghĩa.
     ───────────────────────────────────────────────────────────── */
  :root{
    --bg:#F8FAFC;
    --surface:#FFFFFF;
    --surface-2:#FCFDFE;
    --ink:#1E293B;
    --ink-soft:#475569;
    --ink-mute:#64748B;
    --line:#E2E8F0;
    --line-soft:#EDF1F5;
    --nav:#2563EB;        /* đi tiếp — có hướng */
    --data:#0F766E;       /* dùng chung kho — không hướng */
    --back:#B45309;       /* kết quả quay lại */
    --embed:#6D28D9;      /* app riêng nhúng vào */

    --gap:46px;           /* khoảng giữa hai chặng = chỗ cho đường liên kết */
    --col-body:432px;     /* CỐ ĐỊNH: mở thẻ không làm trang nhảy */
    --lane:52px;          /* dải dưới trục cho đường đi ngược */
    --r:10px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .page{max-width:1460px;margin:0 auto;padding:22px 28px 34px}

  /* ── Đầu trang ───────────────────────────────────────────────── */
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:30px;margin-bottom:16px}
  h1{font-size:26px;line-height:1.22;font-weight:650;margin:0 0 6px;letter-spacing:-0.015em}
  .sub{font-size:13px;line-height:1.5;color:var(--ink-soft);max-width:88ch;margin:0}
  .hint{font-size:12.5px;color:var(--ink-mute);margin:7px 0 0;display:flex;align-items:center;gap:7px}
  .hint svg{flex:none}
  .top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}

  .lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
  .lang button{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
    font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-mute);
    padding:6px 13px;min-height:32px;transition:background .18s ease,color .18s ease}
  .lang button+button{border-left:1px solid var(--line)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .lang button:focus-visible{outline:2px solid var(--nav);outline-offset:-2px}

  /* Chú giải đặt ngay trên trục, cạnh chỗ các đường chạy. Để ở góc
     trên phải thì người đọc phải ngước lên tra lại mỗi lần. */
  .key{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:6px 20px;
    align-items:center;margin:0 0 7px;padding:0 2px}
  .key-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
  .key-row svg{flex:none}
  .key-badge{display:inline-flex;align-items:center;border:1px solid var(--embed);color:var(--embed);
    border-radius:4px;padding:0 5px;font-size:10px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;line-height:16px}

  /* ── Khung sơ đồ = gốc toạ độ của lớp vẽ đường ───────────────── */
  .wrap{position:relative}
  /* thứ tự lớp: nền chặng 0 · đường 1 · thẻ 2 · dải trên 3 · nhãn 5 */
  #edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
  /* nhãn nằm trên thẻ, nếu không thì nhãn của đường trong máng bị thẻ che */
  #edges-top{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:5}

  /* ── Dải xuyên suốt ──────────────────────────────────────────── */
  /* z-index 3: phải cao hơn .stage (0) nếu không panel của thẻ dải
     trên sẽ bị các cột chặng vẽ đè lên. Không đường nào chạy vào
     trong khung dải này nên nâng lớp không che mất đường. */
  .band{position:relative;z-index:3;border:1px solid var(--line);border-radius:var(--r);
    background:var(--surface);padding:8px 12px;margin-bottom:9px;
    display:grid;grid-template-columns:auto repeat(3,1fr);gap:12px;align-items:stretch}
  .band-label,.ground-label{display:flex;align-items:center;font-size:10.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute);line-height:1.3}
  .band-label{padding-right:12px;border-right:1px solid var(--line-soft);max-width:15ch}

  /* ── Trục 4 chặng ────────────────────────────────────────────── */
  .spine{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
  .stage{position:relative;z-index:0;border:1px solid var(--line);border-radius:var(--r);
    background:var(--surface-2);display:flex;flex-direction:column}
  .stage:not(:last-child)::after{content:"";position:absolute;top:25px;
    right:calc(-1 * var(--gap) / 2 - 5px);width:10px;height:10px;
    border-top:1.5px solid #94A3B8;border-right:1.5px solid #94A3B8;transform:rotate(45deg)}
  .stage-head{padding:10px 12px 9px;border-bottom:1px solid var(--line-soft);
    display:flex;gap:9px;align-items:baseline}
  .stage-no{font-size:15px;font-weight:700;color:var(--ink-mute);font-variant-numeric:tabular-nums;
    line-height:1;flex:none;min-width:13px}
  .stage-name{font-size:12.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
    line-height:1.3;margin:0}
  .stage-body{height:var(--col-body);padding:10px;overflow:hidden;
    display:flex;flex-direction:column;gap:6px;
    justify-content:center;justify-content:safe center}

  /* ── Thẻ module ──────────────────────────────────────────────── */
  .card{position:relative;z-index:2;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:0;overflow:visible;
    display:flex;flex-direction:column;flex:none;min-height:0;
    transition:border-color .18s ease,box-shadow .18s ease,opacity .18s ease,
      flex-grow .2s ease,flex-basis .2s ease}
  .card:hover{border-color:#B6C2D2;box-shadow:0 1px 3px rgba(15,23,42,.07)}
  .card-btn{appearance:none;border:0;background:transparent;width:100%;font:inherit;color:inherit;
    text-align:left;cursor:pointer;padding:8px 11px;display:flex;flex-direction:column;gap:3px;
    flex:none;transition:padding .18s ease}
  .card-btn:focus-visible{outline:2px solid var(--nav);outline-offset:-2px;border-radius:7px}
  .card-name{font-size:14.5px;font-weight:600;line-height:1.28;display:flex;align-items:center;gap:6px}
  /* Ai dùng khối này. Chữ thường, lùi về phải, không viền — để không
     tranh chấp với tên khối mà vẫn trả lời được câu "ai dùng cái này". */
  .roles{margin-left:auto;flex:none;font-size:10.5px;font-weight:400;
    color:var(--ink-mute);white-space:nowrap;letter-spacing:.01em}
  .card.is-collapsed .roles{display:none}
  .card-one{font-size:12.5px;line-height:1.42;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .embed-badge{flex:none;border:1px solid var(--embed);color:var(--embed);border-radius:4px;
    padding:0 4px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:15px}

  /* trạng thái */
  /* .42 chứ không .32: thẻ mờ vẫn bấm được và Tab vẫn tới được, nên
     phải còn đọc nổi; và hễ được focus thì sáng lại hẳn. */
  .card.is-dim{opacity:.42}
  .card.is-dim:focus-within,.card.is-dim:hover{opacity:1}
  .card.is-partner{border-color:#94A3B8;box-shadow:0 0 0 1px #94A3B8 inset}
  .card.is-open{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset,0 2px 10px rgba(15,23,42,.08)}
  .stage .card.is-open{flex:1 1 auto;min-height:0;overflow:hidden}
  .card.is-collapsed .card-btn{padding:5px 11px;gap:0}
  .card.is-collapsed .card-one{display:none}
  .card.is-collapsed .card-name{font-size:12.5px;font-weight:500;color:var(--ink-mute)}
  .card.is-collapsed .embed-badge{display:none}

  /* ── Tầng chi tiết ───────────────────────────────────────────── */
  .detail{display:none}
  .card.is-open>.detail{display:flex;flex-direction:column;min-height:0}
  .stage .card.is-open>.detail{flex:1 1 auto;padding:0 11px 9px}
  /* Thẻ ở dải xuyên suốt: mở thành panel neo dưới thẻ, không đẩy layout */
  /* Panel trải hết bề rộng sơ đồ và thấp xuống, chia hai cột chữ:
     không thể tràn lề, chỉ che một dải mỏng trên cùng của trục, và
     vừa đủ chỗ nên không phải cuộn. Mũi nhọn chỉ về đúng thẻ (JS đặt). */
  .band{position:relative}
  .band .card{position:static}
  .band .card.is-open>.detail{
    position:absolute;top:calc(100% + 9px);left:0;right:0;
    max-height:232px;z-index:30;
    background:var(--surface);border:1px solid var(--ink);border-radius:9px;
    padding:11px 14px 10px;box-shadow:0 10px 30px rgba(15,23,42,.14)}
  .band .card.is-open>.detail .detail-scroll{
    display:grid;grid-template-columns:1.15fr 1fr;gap:0 26px;align-content:start}
  /* Các bước xếp thành hai cột nhỏ nữa, để cả panel thấp xuống và
     không phải cuộn — panel càng thấp thì càng che ít trục. */
  /* display:block vì ol.steps mặc định là flex, mà flex thì bỏ qua
     thuộc tính chia cột. */
  .band .card.is-open>.detail ol.steps{display:block;columns:2;column-gap:22px}
  .band .card.is-open>.detail ol.steps li{break-inside:avoid;margin-bottom:5px}
  .band .card.is-open>.detail::before{
    content:"";position:absolute;top:-6px;left:var(--arrow-x,50%);margin-left:-6px;
    width:11px;height:11px;background:var(--surface);
    border-left:1px solid var(--ink);border-top:1px solid var(--ink);
    transform:rotate(45deg)}

  /* Thanh cuộn để hiện thường trực: nếu ẩn thì chữ dừng giữa câu
     bị đọc thành lỗi hiển thị chứ không phải "còn nữa, cuộn xuống". */
  .detail-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:8px;
    scrollbar-width:thin;scrollbar-gutter:stable;scrollbar-color:#B6C2D2 #EDF1F5}
  .detail-scroll::-webkit-scrollbar{width:7px}
  .detail-scroll::-webkit-scrollbar-track{background:#EDF1F5;border-radius:4px}
  .detail-scroll::-webkit-scrollbar-thumb{background:#B6C2D2;border-radius:4px}

  .d-head{font-size:10.5px;font-weight:700;letter-spacing:.02em;
    color:var(--ink-mute);margin:10px 0 5px}
  .d-head:first-child{margin-top:0}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:4px}
  ol.steps li{counter-increment:s;position:relative;padding-left:20px;
    font-size:12.4px;line-height:1.45;color:var(--ink-soft)}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:15px;height:15px;
    border-radius:50%;background:var(--line-soft);color:var(--ink-mute);font-size:9.5px;
    font-weight:700;display:flex;align-items:center;justify-content:center}
  .d-note{font-size:12.2px;line-height:1.5;color:var(--ink);background:var(--line-soft);
    border-radius:6px;padding:7px 9px;margin-top:6px}
  ul.links{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  ul.links li{display:flex;gap:7px;align-items:flex-start;font-size:12.2px;line-height:1.4;color:var(--ink-soft)}
  ul.links .tick{flex:none;margin-top:5px}
  ul.links b{color:var(--ink);font-weight:600}
  ul.links li{border-radius:5px;padding:1px 4px;margin-left:-4px;cursor:default;
    transition:background .15s ease}
  ul.links li:hover{background:var(--line-soft)}
  .edge.is-solo{stroke-width:2.6}
  /* gợi ý còn nội dung bên dưới, để người đọc biết mà cuộn */
  .stage .card.is-open>.detail{position:relative}
  .stage .card.is-open>.detail.has-more::after{content:"";position:absolute;left:11px;right:16px;
    bottom:37px;height:13px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}

  .close{align-self:flex-start;margin-top:8px;flex:none;appearance:none;background:transparent;
    border:1px solid var(--line);border-radius:6px;font:inherit;font-size:11.5px;
    color:var(--ink-mute);cursor:pointer;padding:4px 10px;min-height:26px}
  .close:hover{border-color:#B6C2D2;color:var(--ink)}
  .close:focus-visible{outline:2px solid var(--nav);outline-offset:2px}

  /* ── Dải dưới trục + nền chung ───────────────────────────────── */
  .lane-band{height:var(--lane)}
  .ground{position:relative;z-index:0;border:1px solid var(--line);border-radius:var(--r);
    background:linear-gradient(180deg,#F1F5F9,#E9EEF4);padding:10px 14px;
    display:grid;grid-template-columns:auto 1fr 1fr;gap:16px;align-items:center}
  .ground-label{padding-right:14px;border-right:1px solid #D5DEE8;max-width:12ch}
  .ground-item{display:flex;flex-direction:column;gap:2px;transition:opacity .18s ease}
  .ground-item.is-dim{opacity:.45}
  .ground-item .gname{font-size:13px;font-weight:600}
  .ground-item .gone{font-size:12.2px;line-height:1.42;color:var(--ink-soft)}

  .notice{display:none;margin:0 0 10px;padding:7px 11px;border-radius:7px;
    background:#FEF6E7;border:1px solid #E8D9B8;color:#7A5B12;
    font-size:12px;line-height:1.45}
  .foot{margin-top:18px;font-size:11.5px;color:var(--ink-mute);line-height:1.6;max-width:110ch}
  .foot b{color:var(--ink-soft);font-weight:600}

  /* ── Đường liên kết ──────────────────────────────────────────── */
  .edge{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .edge-nav{stroke:var(--nav);stroke-width:1.6}
  .edge-data{stroke:var(--data);stroke-width:1.6;stroke-dasharray:5 4}
  .edge-back{stroke:var(--back);stroke-width:1.7}
  .edge.is-ghost{opacity:.34;stroke-width:1.3}
  .elabel rect{fill:#fff;stroke:var(--line)}
  .elabel.k-nav rect{stroke:var(--nav)}
  .elabel.k-data rect{stroke:var(--data)}
  .elabel.k-back rect{stroke:var(--back)}
  .elabel text{font-size:10.5px;fill:var(--ink-soft);font-weight:500}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ── Màn hình hẹp: xếp dọc, bỏ lớp vẽ đường ──────────────────── */
  @media (max-width:1180px){
    #edges,#edges-top,.lane-band{display:none}
    /* Ẩn lớp đường thì phải ẩn cả chú giải của nó và nói rõ ra, không
       thì người đọc thấy chú giải mô tả những đường không tồn tại. */
    .key{display:none}
    .notice{display:block}
    .spine{grid-template-columns:repeat(2,1fr);gap:18px}
    .stage:not(:last-child)::after{display:none}
    .stage-body{height:auto;overflow:visible}
    .stage .card.is-open{flex:none;overflow:visible}
    .card.is-collapsed .card-btn{padding:8px 11px;gap:3px}
    .card.is-collapsed .card-one{display:-webkit-box}
    .card.is-collapsed .card-name{font-size:14.5px;font-weight:600;color:inherit}
    .detail-scroll{overflow:visible}
    .band{grid-template-columns:1fr}
    .band-label{border-right:0;border-bottom:1px solid var(--line-soft);padding:0 0 8px;max-width:none}
    .band .card{position:relative}
    .band .card.is-open>.detail{position:static;max-height:none;
      z-index:auto;border:0;border-radius:0;padding:0 11px 9px;box-shadow:none}
    .band .card.is-open>.detail .detail-scroll{display:block}
    .band .card.is-open>.detail::before{display:none}
    .ground{grid-template-columns:1fr}
    .ground-label{border-right:0;border-bottom:1px solid #D5DEE8;padding:0 0 8px;max-width:none}
  }
  @media (max-width:720px){
    .spine{grid-template-columns:1fr}
    .top{flex-direction:column}
    .top-right{align-items:flex-start}
    .key{align-items:flex-start}
  }

  /* ── Bản in: giữ cấu trúc, bỏ lớp vẽ đường vì toạ độ tính theo
        màn hình sẽ lệch khi đổi khổ giấy ─────────────────────────── */
  @page{size:A4 landscape;margin:9mm}
  @media print{
    body{background:#fff}
    .page{padding:0;max-width:none}
    .lang,.hint,.close,#edges,#edges-top,.lane-band{display:none!important}
    .card{opacity:1!important;box-shadow:none!important;border-color:#94A3B8!important}
    .card.is-collapsed .card-btn{padding:8px 11px;gap:3px}
    .card.is-collapsed .card-one{display:-webkit-box}
    .card.is-collapsed .card-name{font-size:14.5px;font-weight:600;color:inherit}
    .detail{display:none!important}
    .stage,.band,.ground{break-inside:avoid;page-break-inside:avoid}
    .stage-body{height:auto;overflow:visible}
    /* Ở khổ A4 ngang (~1123px) bộ quy tắc màn-hình-hẹp sẽ nhảy vào và
       xếp 4 chặng thành 2x2, làm mất mạch trái-sang-phải. Ép lại 4 cột
       và thu cỡ chữ để gọn trong một trang. */
    .spine{grid-template-columns:repeat(4,1fr)!important;gap:13px!important}
    .band{grid-template-columns:auto repeat(3,1fr)!important;gap:10px!important}
    .band-label{border-right:1px solid var(--line-soft)!important;border-bottom:0!important;
      padding:0 10px 0 0!important;max-width:11ch!important}
    .ground{grid-template-columns:auto 1fr 1fr!important;gap:12px!important}
    .ground-label{border-right:1px solid #D5DEE8!important;border-bottom:0!important;
      padding:0 12px 0 0!important;max-width:11ch!important}
    .stage:not(:last-child)::after{display:block!important;top:22px;
      right:calc(-13px / 2 - 5px);width:8px;height:8px}
    h1{font-size:19px}
    .sub{font-size:10.5px;max-width:none}
    .key-row{font-size:9.5px}
    .stage-head{padding:8px 10px 7px}
    .stage-name{font-size:10.5px}
    .stage-no{font-size:12px}
    .stage-body{padding:8px;gap:5px}
    .card-btn{padding:6px 9px}
    .card-name{font-size:12px}
    .card-one{font-size:10.4px;line-height:1.36;-webkit-line-clamp:4}
    .ground-item .gname{font-size:11px}
    .ground-item .gone{font-size:10.2px;line-height:1.36}
    .foot{font-size:9.5px;margin-top:12px}
    #print-note{display:block!important}
    .ground{background:#F1F5F9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
      <p class="hint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></svg>
        <span id="t-hint"></span>
      </p>
    </div>
    <div class="top-right">
      <div class="lang" role="group" aria-label="Language / Ngôn ngữ">
        <button type="button" data-lang="vi" aria-pressed="true">VI</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>

  <div class="wrap" id="wrap">
    <svg id="edges" aria-hidden="true">
      <defs>
        <marker id="ah-nav" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB"/>
        </marker>
        <marker id="ah-back" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

/* Danh sách liên kết trong thẻ được SINH RA từ EDGES, để chữ và
   đường vẽ không thể lệch nhau. */
const RANK = {nav:0, data:1, back:2};
function linksFor(id){
  const out = [];
  EDGES.forEach(function(e, i){
    const isFrom = e.from === id, isTo = e.to === id;
    if(!isFrom && !isTo) return;
    const other = isFrom ? e.to : e.from;
    const long = LONG[e.from + ">" + e.to];
    out.push({
      idx: i,
      type: e.type,
      name: NODE[other].n[lang].name,
      why:  (long && long[lang]) || e[lang],
      key:  e.type === "data" ? "data" : (e.type + (isFrom ? "-out" : "-in"))
    });
  });
  out.sort(function(a,b){ return (RANK[a.type]-RANK[b.type]) || a.name.localeCompare(b.name); });
  return out;
}

function cardHTML(n, bandpos){
  const d = n[lang];
  const badge = n.embed ? '<span class="embed-badge">'+(lang==="vi"?"app riêng":"separate app")+'</span>' : "";
  const steps = d.flow.map(s => "<li>"+esc(s)+"</li>").join("");
  const links = linksFor(n.id).map(function(l){
    return '<li data-edge="'+l.idx+'">'+GLYPH[l.key]
         + "<span><b>"+esc(l.name)+"</b> — "+esc(l.why)+"</span></li>";
  }).join("");
  return ''
   + '<div class="card" data-node="'+n.id+'" data-id="'+n.id+'"'
   +   (bandpos ? ' data-bandpos="'+bandpos+'"' : "") + '>'
   +   '<button class="card-btn" type="button" aria-expanded="false">'
   +     '<span class="card-name">'+esc(d.name)+badge
   +       '<span class="roles">'+esc(roleLabel(n.roles))+'</span></span>'
   +     '<span class="card-one">'+esc(d.one)+'</span>'
   +   '</button>'
   +   '<div class="detail">'
   +     '<div class="detail-scroll">'
   +       '<div class="d-flow">'
   +         '<p class="d-head">'+esc(UI[lang].dFlow)+'</p>'
   +         '<ol class="steps">'+steps+'</ol>'
   +         (d.note ? '<p class="d-note">'+esc(d.note)+'</p>' : "")
   +       '</div>'
   +       (links ? '<div class="d-links"><p class="d-head">'+esc(UI[lang].dLinks)+'</p><ul class="links">'+links+'</ul></div>' : "")
   +     '</div>'
   +     '<button class="close" type="button">'+esc(UI[lang].close)+'</button>'
   +   '</div>'
   + '</div>';
}

function applyState(){
  const partners = new Set();
  if(openId){
    EDGES.forEach(function(e){
      if(e.from===openId) partners.add(e.to);
      if(e.to===openId)   partners.add(e.from);
    });
  }
  document.querySelectorAll(".card").forEach(function(el){
    const id = el.dataset.id;
    /* chi thu the cung cot trong TRUC - dai xuyen suot khong co
       chieu cao co dinh nen thu lai se lam ca trang dich len */
    const oc = openId ? NODE[openId].col : null;
    const sameCol = openId && oc >= 0 && oc <= 3 && NODE[id].col === oc;
    el.classList.toggle("is-open",      id===openId);
    el.classList.toggle("is-collapsed", !!openId && id!==openId && !!sameCol);
    el.classList.toggle("is-partner",   !!openId && partners.has(id));
    el.classList.toggle("is-dim",       !!openId && id!==openId && !partners.has(id));
    el.querySelector(".card-btn").setAttribute("aria-expanded", id===openId ? "true" : "false");
  });
  document.querySelectorAll(".ground-item").forEach(function(el){
    el.classList.toggle("is-dim", !!openId && !partners.has(el.dataset.node));
  });
  requestAnimationFrame(function(){ drawEdges(openId, null); updateFade(); aimPanelArrow(); });
}

/* Mũi nhọn của panel dải trên chỉ về giữa thẻ đang mở. Đo thật vì
   bề rộng thẻ đổi theo cỡ cửa sổ. */
function aimPanelArrow(){
  const card = band.querySelector(".card.is-open");
  if(!card) return;
  const det = card.querySelector(".detail");
  if(!det) return;
  const bb = band.getBoundingClientRect(), cb = card.getBoundingClientRect();
  if(!bb.width) return;
  det.style.setProperty("--arrow-x", ((cb.left + cb.width/2 - bb.left) / bb.width * 100).toFixed(2) + "%");
}

/* Vệt mờ ở đáy chỉ hiện khi thật sự còn nội dung chưa đọc tới,
   không thì nó làm câu đang đọc trông như bị cắt. */
function updateFade(){
  document.querySelectorAll(".card.is-open>.detail").forEach(function(d){
    const sc = d.querySelector(".detail-scroll");
    if(!sc) return;
    d.classList.toggle("has-more", sc.scrollHeight - sc.scrollTop - sc.clientHeight > 4);
  });
}

function geo(){
  const box = wrap.getBoundingClientRect();
  const rectOf = function(el){
    if(!el) return null;
    const r = el.getBoundingClientRect();
    return {x:r.left-box.left, y:r.top-box.top, w:r.width, h:r.height,
            cx:r.left-box.left+r.width/2, cy:r.top-box.top+r.height/2};
  };
  const cols = Array.prototype.map.call(wrap.querySelectorAll(".stage"), function(el){
    const r = el.getBoundingClientRect();
    return {left:r.left-box.left, right:r.right-box.left};
  });
  return {
    cols:cols,
    W:box.width,
    bandR:rectOf(band),
    spineR:rectOf(spine),
    groundR:rectOf(ground),
    node:function(id){ return rectOf(wrap.querySelector('[data-node="'+id+'"]')); }
  };
}

function unit(a,b){
  const dx=b.x-a.x, dy=b.y-a.y, m=Math.hypot(dx,dy)||1;
  return {x:dx/m, y:dy/m, m:m};
}

function roundPath(pts, r){
  if(pts.length < 2) return "";
  let d = "M "+pts[0].x.toFixed(1)+" "+pts[0].y.toFixed(1);
  for(let i=1;i<pts.length-1;i++){
    const p0=pts[i-1], p1=pts[i], p2=pts[i+1];
    const v1=unit(p1,p0), v2=unit(p1,p2);
    const rr = Math.max(0, Math.min(r, v1.m/2, v2.m/2));
    d += " L "+(p1.x+v1.x*rr).toFixed(1)+" "+(p1.y+v1.y*rr).toFixed(1);
    d += " Q "+p1.x.toFixed(1)+" "+p1.y.toFixed(1)+" "+(p1.x+v2.x*rr).toFixed(1)+" "+(p1.y+v2.y*rr).toFixed(1);
  }
  const z = pts[pts.length-1];
  return d + " L "+z.x.toFixed(1)+" "+z.y.toFixed(1);
}

function buildPath(e, g, off){
  const a = g.node(e.from), b = g.node(e.to);
  if(!a || !b) return null;
  const ca = NODE[e.from].col, cb = NODE[e.to].col;
  const GUT = 15;
  const gL = function(c){ return Math.max(7, g.cols[c] ? g.cols[c].left  - GUT : a.x - GUT); };
  const gR = function(c){ return Math.min(g.W-7, g.cols[c] ? g.cols[c].right + GUT : a.x + a.w + GUT); };
  const laneY = g.spineR.y + g.spineR.h + 13 + off*13;
  const topY  = g.spineR.y - 12;
  const gndY  = g.groundR.y - 12;
  const bbY   = g.bandR.y + g.bandR.h + 6 + off*6;

  /* dải trên -> thẻ trong chặng */
  if(ca === -1 && cb >= 0 && cb <= 3)
    return roundPath([{x:a.cx,y:a.y+a.h},{x:a.cx,y:topY},{x:gL(cb),y:topY},
                      {x:gL(cb),y:b.cy},{x:b.x,y:b.cy}], 9);
  /* thẻ trong chặng -> dải trên */
  if(cb === -1 && ca >= 0 && ca <= 3)
    return roundPath([{x:a.x,y:a.cy},{x:gL(ca),y:a.cy},{x:gL(ca),y:topY},
                      {x:b.cx,y:topY},{x:b.cx,y:b.y+b.h}], 9);
  /* hai khối cùng ở dải trên -> chạy dưới dải */
  if(ca === -1 && cb === -1)
    return roundPath([{x:a.cx,y:a.y+a.h},{x:a.cx,y:bbY},{x:b.cx,y:bbY},{x:b.cx,y:b.y+b.h}], 8);
  /* xuống nền chung / lên từ nền chung */
  if(cb === 9)
    return roundPath([{x:a.x,y:a.cy},{x:gL(ca),y:a.cy},{x:gL(ca),y:gndY},
                      {x:b.cx,y:gndY},{x:b.cx,y:b.y}], 9);
  if(ca === 9)
    return roundPath([{x:a.cx,y:a.y},{x:a.cx,y:gndY},{x:gL(cb),y:gndY},
                      {x:gL(cb),y:b.cy},{x:b.x,y:b.cy}], 9);
  /* cùng một chặng -> vòng qua bên trái */
  /* Hai thẻ có thể nối nhau bằng nhiều loại liên kết (ví dụ Lớp học
     và Thời khóa biểu vừa dùng chung dữ liệu vừa bấm qua được), nên
     phải đẩy mỗi đường ra một làn riêng, không thì chúng trùng khít. */
  if(ca === cb){
    /* Chặng ① nằm sát lề trái: đi vòng bên trái là chạy ra ngoài trang,
       nên chặng ① phải đi vòng bên phải. */
    const right = (ca === 0);
    const x  = right ? gR(ca) + off*8 : gL(ca) - off*8;
    const ax = right ? a.x + a.w : a.x;
    const bx = right ? b.x + b.w : b.x;
    return roundPath([{x:ax,y:a.cy},{x:x,y:a.cy},{x:x,y:b.cy},{x:bx,y:b.cy}], 8);
  }
  /* hai chặng liền nhau, đi xuôi -> cong ngang gọn */
  if(cb === ca + 1){
    const x1=a.x+a.w, x2=b.x, mx=(x1+x2)/2;
    return "M "+x1.toFixed(1)+" "+a.cy.toFixed(1)
         + " C "+mx.toFixed(1)+" "+a.cy.toFixed(1)+" "+mx.toFixed(1)+" "+b.cy.toFixed(1)
         + " "+x2.toFixed(1)+" "+b.cy.toFixed(1);
  }
  /* đi xuôi nhưng nhảy chặng -> chạy dưới trục */
  if(cb > ca)
    return roundPath([{x:a.x+a.w,y:a.cy},{x:gR(ca),y:a.cy},{x:gR(ca),y:laneY},
                      {x:gL(cb),y:laneY},{x:gL(cb),y:b.cy},{x:b.x,y:b.cy}], 9);
  /* đi ngược -> chạy dưới trục, vào từ bên phải */
  return roundPath([{x:a.x,y:a.cy},{x:gL(ca),y:a.cy},{x:gL(ca),y:laneY},
                    {x:gR(cb),y:laneY},{x:gR(cb),y:b.cy},{x:b.x+b.w,y:b.cy}], 9);
}

const NS = "http://www.w3.org/2000/svg";

function drawEdges(activeId, hoverId, solo){
  eLayer.textContent = "";
  lLayer.textContent = "";
  if(getComputedStyle(svg).display === "none") return;

  const g = geo();
  if(!g.spineR || !g.groundR || !g.cols.length) return;

  const focus = activeId || hoverId;
  const ghost = !!hoverId && !activeId;
  const list  = (solo != null && EDGES[solo]) ? [EDGES[solo]]
              : focus ? EDGES.filter(function(e){ return e.from===focus || e.to===focus; })
              : EDGES.filter(function(e){ return e.spine; });

  const seat = {lane:0, col:0, band:0};

  list.forEach(function(e){
    const ca = NODE[e.from].col, cb = NODE[e.to].col;
    const bothInSpine = ca>=0 && ca<=3 && cb>=0 && cb<=3;
    let off = 0;
    if(bothInSpine && ca === cb){          off = seat.col;  seat.col  = (seat.col+1)%4; }
    else if(bothInSpine && (cb<ca || cb>ca+1)){ off = seat.lane; seat.lane = (seat.lane+1)%4; }
    else if(ca === -1 && cb === -1){       off = seat.band; seat.band = (seat.band+1)%3; }
    const d = buildPath(e, g, off);
    if(!d) return;

    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("class", "edge edge-"+e.type
      + (ghost ? " is-ghost" : "") + (solo != null ? " is-solo" : ""));
    if(e.type === "nav")  p.setAttribute("marker-end", "url(#ah-nav)");
    if(e.type === "back") p.setAttribute("marker-end", "url(#ah-back)");
    eLayer.appendChild(p);

    /* Nhãn chỉ dán khi người đọc rê vào đúng một dòng liên kết, cộng
       với mũi quay lại ở lớp đầu vì đó là mũi kể chuyện chính.
       Dán tất cả nhãn cùng lúc thì chúng che mất tên thẻ. */
    if(solo != null || (!focus && e.type === "back")){
      let mid;
      try{ mid = p.getPointAtLength(p.getTotalLength()/2); }catch(err){ return; }
      const txt = e[lang];
      const w = Math.max(34, txt.length*5.8 + 12);
      /* kẹp tâm nhãn để pill không chạy ra ngoài lề trang */
      mid = {x: Math.min(Math.max(mid.x, w/2 + 2), g.W - w/2 - 2), y: mid.y};
      const grp = document.createElementNS(NS, "g");
      grp.setAttribute("class","elabel k-"+e.type);
      const r = document.createElementNS(NS, "rect");
      r.setAttribute("x",(mid.x-w/2).toFixed(1)); r.setAttribute("y",(mid.y-8.5).toFixed(1));
      r.setAttribute("width",w.toFixed(1)); r.setAttribute("height","17"); r.setAttribute("rx","4");
      const tx = document.createElementNS(NS, "text");
      tx.setAttribute("x",mid.x.toFixed(1)); tx.setAttribute("y",(mid.y+3.6).toFixed(1));
      tx.setAttribute("text-anchor","middle");
      tx.textContent = txt;
      grp.appendChild(r); grp.appendChild(tx);
      lLayer.appendChild(grp);
    }
  });
}

/* ══════════════════════════════════════════════════════════════════
   TƯƠNG TÁC
   ══════════════════════════════════════════════════════════════════ */

document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){
    if(lang === b.dataset.lang) return;
    lang = b.dataset.lang;
    document.querySelectorAll(".lang button").forEach(function(x){
      x.setAttribute("aria-pressed", x.dataset.lang === lang ? "true" : "false");
    });
    render();
  });
});

wrap.addEventListener("click", function(ev){
  if(ev.target.closest(".close")){ openId = null; applyState(); return; }
  const card = ev.target.closest(".card");
  if(!card) return;
  /* Bôi đen để copy một bước, hay bấm một dòng liên kết, thì không
     được coi là bấm để đóng thẻ. */
  if(openId === card.dataset.id && ev.target.closest(".detail")) return;
  openId = (openId === card.dataset.id) ? null : card.dataset.id;
  applyState();
  if(openId){
    const btn = card.querySelector(".card-btn");
    if(btn) btn.focus();
  }
});

wrap.addEventListener("mouseover", function(ev){
  const row = ev.target.closest("ul.links li");
  if(row && openId){ drawEdges(openId, null, +row.dataset.edge); return; }
  if(openId) return;
  const card = ev.target.closest(".card");
  if(card) drawEdges(null, card.dataset.id);
});
wrap.addEventListener("mouseout", function(ev){
  if(ev.target.closest("ul.links li")){ drawEdges(openId, null); return; }
  if(openId) return;
  if(ev.target.closest(".card")) drawEdges(null, null);
});

document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape" && openId){ openId = null; applyState(); }
});

wrap.addEventListener("scroll", updateFade, true);

let rt;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(function(){ drawEdges(openId, null); aimPanelArrow(); }, 120);
});

render();
</script>
